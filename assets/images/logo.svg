<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DCCE93;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5EABA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C5A059;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teal_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B7A7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#214444;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="4" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Shield Body -->
  <path d="M256 45L430 90V240C430 360 256 465 256 465C256 465 82 360 82 240V90L256 45Z" fill="url(#teal_gradient)" stroke="url(#gold_gradient)" stroke-width="14" filter="url(#shadow)"/>

  <!-- Stylized Metallic Patterns -->
  <g fill="none" stroke="url(#gold_gradient)" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Center S-Logic Line -->
    <path d="M220 120L340 240L256 324L340 408" stroke-width="24" />
    
    <!-- Parallel Diagonal 1 (Left) -->
    <path d="M140 180L220 260" />
    
    <!-- Parallel Diagonal 2 (Left Lower) -->
    <path d="M160 280L220 340" />

    <!-- Parallel Diagonal 3 (Right) -->
    <path d="M360 140L410 190" />
  </g>

  <!-- Accent Trim -->
  <path d="M256 45L256 465" stroke="white" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle Internal Glow/Bevel -->
  <path d="M256 59L416 100V240C416 350 256 451 256 451C256 451 96 350 96 240V100L256 59Z" stroke="white" stroke-opacity="0.1" stroke-width="2" fill="none"/>
</svg>
