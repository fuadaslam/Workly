<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Ultra-modern Swiss / Tech Logo -->
  <rect width="512" height="512" fill="#050505" rx="100"/>
  
  <g transform="translate(126, 130)">
    <!-- Sleek, continuous dynamic line forming W -->
    <path d="M 0 0 L 60 140 L 130 40 L 200 140 L 260 0" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Vivid Accent for "Q" or "Org" -->
    <circle cx="220" cy="160" r="18" fill="#EAB308" />
    <circle cx="260" cy="180" r="12" fill="#EF4444" />
  </g>

  <text x="256" y="380" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="64" 
        font-weight="600" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-3">worqly</text>
        
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="14" 
        font-weight="500" 
        fill="#6B7280" 
        text-anchor="middle" 
        letter-spacing="8">WORK + ORG</text>
</svg>
